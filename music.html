<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ILLIT Flip-Phone Player 🎀</title>
    <link rel="stylesheet" href="https://unpkg.com/7.css">
    <style>
        /* --- 全局鼠标与复古基础样式 --- */
        html, body, a, button, input {
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20"><path d="M0,0 L0,15 L4,11 L7,17 L9,16 L6,10 L11,10 Z" fill="%2378FFB1" stroke="black" stroke-width="1" style="shape-rendering:crispEdges;"/></svg>'), auto !important;
        }
        :root {
            --phone-pink: #ff99cc;
            --screen-dark: #1a1a1a;
            --list-pink: rgba(255, 192, 203, 0.8);
        }
        body {
            margin: 0; padding: 0; min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            background: linear-gradient(135deg, #ffc1e3 0%, #e1bee7 35%, #b3e5fc 70%, #ffc1e3 100%);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            font-family: 'Courier New', monospace;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 顶部精简导航栏 */
        .global-nav-bar {
            width: 100%; background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(5px); border-bottom: 2px solid #ff80ab;
            padding: 8px 0; display: flex; justify-content: center; gap: 20px; 
            position: fixed; top: 0; left: 0; z-index: 9999;
        }
        .global-nav-bar a { 
            text-decoration: none; color: #ff4081; font-size: 12px; font-weight: bold; padding: 3px 10px; 
        }

        /* 播放器整体左右布局容器 */
        .player-container {
            display: flex; align-items: flex-start; gap: 20px; z-index: 10;
            max-width: 850px; width: 95%; margin-top: 50px;
        }

        /* 左侧：翻盖手机外观 */
        .flip-phone {
            width: 260px; background: var(--phone-pink);
            border-radius: 30px; padding: 25px 15px;
            box-shadow: 8px 8px 0px rgba(0,0,0,0.1);
            border: 3px solid #fff;
        }
        .phone-screen {
            background: var(--screen-dark); border-radius: 15px;
            padding: 12px; position: relative; border: 4px solid #333;
            height: 300px; display: flex; flex-direction: column; align-items: center;
        }
        .status-bar { width: 100%; display: flex; justify-content: space-between; font-size: 10px; color: #fff; }
        
        /* CD 转盘动画 */
        .disk-wrapper { width: 130px; height: 130px; position: relative; margin: 10px 0; }
        .disk {
            width: 100%; height: 100%; border-radius: 50%;
            border: 4px solid #fff; object-fit: cover;
            animation: rotate 6s linear infinite;
            animation-play-state: paused;
        }
        .disk::after {
            content: ''; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); width: 25px; height: 25px;
            background: var(--screen-dark); border-radius: 50%; border: 2px solid #fff;
        }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* 手机键盘区 */
        .phone-keypad {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
            background: rgba(255,255,255,0.3); padding: 12px; border-radius: 12px; margin-top: 15px;
        }
        .key {
            background: #fff; border: none; border-radius: 4px;
            padding: 6px; font-size: 11px; font-weight: bold; color: var(--phone-pink);
            cursor: pointer; box-shadow: 0 2px 0 #d482ab;
        }
        .key:active { transform: translateY(2px); box-shadow: none; }
        .key.play-key { background: #ff4081; color: #fff; grid-column: span 1; font-size: 14px; }
        
        .exit-btn {
            margin-top: 15px; color: #fff; text-decoration: underline; cursor: pointer;
            font-size: 11px; display: block; text-align: center;
        }

        /* 右侧：歌单与数据对比栏 */
        .right-panel { flex: 1; display: flex; flex-direction: column; gap: 15px; }
        
        .track-list-window {
            background: var(--list-pink); border-radius: 15px;
            border: 3px solid #fff; backdrop-filter: blur(10px);
            max-height: 260px; overflow-y: auto;
        }
        .list-header { background: #ff80ab; color: #fff; padding: 8px 15px; font-weight: bold; font-size: 12px; }
        .track-item {
            display: flex; align-items: center; padding: 10px 15px;
            border-bottom: 1px solid rgba(255,255,255,0.3); cursor: pointer; transition: 0.2s;
        }
        .track-item:hover { background: rgba(255,255,255,0.4); }
        .track-item.active { background: #fff; color: #ff4081; }
        .track-info { flex: 1; margin-left: 10px; }
        .track-name { font-size: 12px; font-weight: bold; }
        .track-artist { font-size: 10px; opacity: 0.8; }
    </style>
</head>
<body>

    <!-- 顶部精简导航栏 -->
    <div class="global-nav-bar">
        <a href="index.html">🏠 首页</a>
        <a href="music.html">🎶 音乐</a>
        <a href="photos.html">📸 合照</a>
    </div>

    <div class="player-container">
        
        <!-- 左侧：复古翻盖手机播放器 -->
        <div class="flip-phone">
            <div class="phone-screen">
                <div class="status-bar">
                    <span>📶 5G 💖</span>
                    <span id="p-time">00:00</span>
                </div>
                
                <div class="disk-wrapper">
                    <img id="p-cover" src="IMG_4458.jpeg" class="disk" alt="CD">
                </div>
                
                <div id="p-title" style="color: #ff80ab; font-size: 12px; margin-top: 5px; font-weight: bold;">Magnetic</div>
                <div style="font-size: 9px; color: #fff; margin-top: 2px;">ILLIT Audio System</div>

                <!-- 实时音频频谱监视器内置于屏幕下方 -->
                <canvas id="visualizer" style="width: 100%; height: 35px; background: #000; margin-top: 8px; border: 1px solid #444;"></canvas>
            </div>

            <div class="phone-keypad">
                <button class="key" onclick="audio.currentTime -= 5">⏪</button>
                <button class="key play-key" id="playBtn" onclick="togglePlay()">▶</button>
                <button class="key" onclick="audio.currentTime += 5">⏩</button>
                <button class="key" onclick="changeSong(0)">1</button>
                <button class="key" onclick="changeSong(1)">2</button>
                <button class="key" onclick="changeSong(2)">3</button>
            </div>

            <a class="exit-btn" onclick="window.location.href='index.html'">◀ 返回首页时间轴</a>
        </div>

        <!-- 右侧：歌单与硬核数据对比面板 -->
        <div class="right-panel">
            
            <!-- 歌单视窗 -->
            <div class="window" style="margin:0;">
                <div class="title-bar"><div class="title-bar-text">Playlist.list</div></div>
                <div class="window-body" style="padding:0;">
                    <div class="track-list-window">
                        <div class="list-header">🎵 TRACKLIST & STREAMS</div>
                        <div id="playlist-container"></div>
                    </div>
                </div>
            </div>

            <!-- 歌曲播放量数据对比柱状图视窗 -->
            <div class="window" style="margin:0;">
                <div class="title-bar"><div class="title-bar-text">Song_Data_Comparison.chart</div></div>
                <div class="window-body" style="font-size: 11px;">
                    <p style="margin-top:0;">📊 <b>多平台播放量统计对比：</b></p>
                    <div id="chartContainer" style="background: #000; color: #fff; padding: 8px; height: 90px; display: flex; align-items: flex-end; gap: 20px; justify-content: center;"></div>
                    <p id="chartMeta" style="font-size: 9px; color: #666; margin-top: 5px; text-align: right;"></p>
                </div>
            </div>

        </div>
    </div>

    <!-- 隐藏的音频源 -->
    <audio id="main-audio">
        <source id="audio-src" src="magnetic.mp3.mp3" type="audio/mpeg">
    </audio>

    <script>
        const songs = [
            { title: "Magnetic", cover: "IMG_4458.jpeg", file: "magnetic.mp3.mp3", artist: "NewJeans 1st EP", stats: { streams: [380, 450, 190], labels: ["Spotify", "Apple", "YouTube"], source: "Global Streaming Report", date: "2026-05-18" } },
            { title: "NOT CUTE ANYMORE", cover: "IMG_4456.jpeg", file: "ScreenRecording_04-26-2026 14-47-55_1 (online-audio-converter.com).mp3", artist: "ILLIT Special", stats: { streams: [230, 310, 140], labels: ["Spotify", "Apple", "YouTube"], source: "Official Platform Estimate", date: "2026-05-18" } },
            { title: "Billyeoon Goyangi", cover: "IMG_4457.jpeg", file: "ScreenRecording_04-26-2026 14-58-30_1 (online-audio-converter.com).mp3", artist: "Cat Theme", stats: { streams: [190, 240, 110], labels: ["Spotify", "Apple", "YouTube"], source: "Platform Analytics", date: "2026-05-18" } }
        ];

        const audio = document.getElementById('main-audio');
        const playBtn = document.getElementById('playBtn');
        const cover = document.getElementById('p-cover');
        const title = document.getElementById('p-title');
        const source = document.getElementById('audio-src');
        const playlistContainer = document.getElementById('playlist-container');

        let currentIndex = 0;
        let audioCtx, analyser, dataArray, sourceNode;
        let isAudioInit = false;

        // 初始化歌单与图表
        function initPlaylist() {
            playlistContainer.innerHTML = songs.map((song, i) => `
                <div class="track-item ${i === 0 ? 'active' : ''}" onclick="changeSong(${i})">
                    <div style="font-size: 14px; font-weight: bold; width: 25px; opacity: 0.5;">0${i+1}</div>
                    <div class="track-info">
                        <div class="track-name">${song.title}</div>
                        <div class="track-artist">${song.artist}</div>
                    </div>
                </div>
            `).join('');
            showChart(0);
        }
        initPlaylist();

        // 切换歌曲
        function changeSong(i) {
            currentIndex = i;
            const song = songs[i];
            
            document.querySelectorAll('.track-item').forEach((item, idx) => {
                item.classList.toggle('active', idx === i);
            });

            title.innerText = song.title;
            cover.src = song.cover;
            source.src = song.file;
            audio.load();
            audio.play();
            playBtn.innerText = "❚❚";
            cover.style.animationPlayState = 'running';
            
            showChart(i);
            initAudioVisualizer();
        }

        // 播放/暂停控制
        function togglePlay() {
            initAudioVisualizer();
            if (audio.paused) {
                audio.play();
                playBtn.innerText = "❚❚";
                cover.style.animationPlayState = 'running';
            } else {
                audio.pause();
                playBtn.innerText = "▶";
                cover.style.animationPlayState = 'paused';
            }
        }

        // 播放时间更新
        audio.ontimeupdate = () => {
            const min = Math.floor(audio.currentTime / 60);
            const sec = Math.floor(audio.currentTime % 60);
            document.getElementById('p-time').innerText = `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
        };

        // 渲染数据对比柱状图
        function showChart(index) {
            const data = songs[index].stats;
            const container = document.getElementById('chartContainer');
            container.innerHTML = '';
            
            const maxVal = Math.max(...data.streams);
            
            data.streams.forEach((val, idx) => {
                let barH = (val / maxVal) * 55; // 限制高度
                let col = document.createElement('div');
                col.style.display = 'flex';
                col.style.flexDirection = 'column';
                col.style.alignItems = 'center';
                col.innerHTML = `
                    <span style="font-size: 8px; color: #78FFB1;">${val}M</span>
                    <div style="width: 20px; height: ${barH}px; background: #ff80ab; margin-top: 2px;"></div>
                    <span style="font-size: 8px; margin-top: 2px; color:#fff;">${data.labels[idx]}</span>
                `;
                container.appendChild(col);
            });
            
            document.getElementById('chartMeta').innerText = `来源: ${data.source} | 日期: ${data.date}`;
        }

        // Web Audio API 实时频谱波形分析
        function initAudioVisualizer() {
            if (isAudioInit) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                sourceNode = audioCtx.createMediaElementSource(audio);
                sourceNode.connect(analyser);
                analyser.connect(audioCtx.destination);
                
                analyser.fftSize = 32;
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                isAudioInit = true;
                drawVisualizer();
            } catch (e) {
                console.log("Web Audio API Error:", e);
            }
        }

        const canvasV = document.getElementById('visualizer');
        const ctxV = canvasV ? canvasV.getContext('2d') : null;

        function drawVisualizer() {
            requestAnimationFrame(drawVisualizer);
            if (!isAudioInit || !canvasV || !ctxV) return;

            canvasV.width = canvasV.clientWidth;
            canvasV.height = canvasV.clientHeight;

            analyser.getByteFrequencyData(dataArray);

            ctxV.fillStyle = '#000000';
            ctxV.fillRect(0, 0, canvasV.width, canvasV.height);

            let barW = (canvasV.width / dataArray.length) * 1.5;
            let x = 2;

            for (let i = 0; i < dataArray.length; i++) {
                let barH = (dataArray[i] / 255) * canvasV.height;
                ctxV.fillStyle = '#78FFB1'; // 经典复古绿色频谱
                ctxV.fillRect(x, canvasV.height - barH, barW - 1, barH);
                x += barW + 1;
            }
        }
    </script>
</body>
</html>
