<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ILLIT Retro World 🎀</title>
    <link rel="stylesheet" href="https://unpkg.com/7.css">
    <style>
        /* --- 全局鼠标与复古基础样式 --- */
        html, body, a, button, input {
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20"><path d="M0,0 L0,15 L4,11 L7,17 L9,16 L6,10 L11,10 Z" fill="%2378FFB1" stroke="black" stroke-width="1" style="shape-rendering:crispEdges;"/></svg>'), auto !important;
        }
        body { 
            background: linear-gradient(135deg, #ffc1e3 0%, #e1bee7 35%, #b3e5fc 70%, #ffc1e3 100%);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            margin: 0; padding: 0; min-height: 100vh; 
            display: flex; flex-direction: column; align-items: center; 
            font-family: 'Courier New', monospace;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 顶部精简导航栏 */
        .global-nav-bar {
            width: 100%; background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(5px); border-bottom: 2px solid #ff80ab;
            padding: 8px 0; display: flex; justify-content: center; gap: 20px; 
            position: fixed; top: 0; left: 0; z-index: 9999;
        }
        .global-nav-bar a { 
            text-decoration: none; color: #ff4081; font-size: 12px; font-weight: bold; padding: 3px 10px; 
        }

        /* 首页主体容器 */
        .main-container {
            margin-top: 70px; width: 90%; max-width: 600px; 
            display: flex; flex-direction: column; gap: 20px; padding-bottom: 30px;
        }
    </style>
</head>
<body>

    <!-- 顶部精简导航栏（只留首页、音乐、合照） -->
    <div class="global-nav-bar">
        <a href="index.html">🏠 首页</a>
        <a href="music.html">🎶 音乐</a>
        <a href="photos.html">📸 合照</a>
    </div>

    <div class="main-container">
        
        <!-- 欢迎看板窗口 -->
        <div class="window">
            <div class="title-bar">
                <div class="title-bar-text">ILLIT_Welcome_Center.exe</div>
            </div>
            <div class="window-body" style="text-align: center;">
                <h2 style="color: #ff4081; margin: 10px 0;">✨ ILLIT Retro Project ✨</h2>
                <p style="color: #555; font-size: 13px;">欢迎来到复古风格作品展示与互动空间！</p>
                <hr style="border: 0; border-top: 1px dashed #ccc; margin: 15px 0;">
                <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
                    <button onclick="window.location.href='music.html'">🎵 进入音乐与频谱</button>
                    <button onclick="window.location.href='photos.html'">📸 开启拍立得合照</button>
                </div>
            </div>
        </div>

        <!-- 作品发展时间轴窗口 -->
        <div class="window">
            <div class="title-bar">
                <div class="title-bar-text">Works_Timeline_History.sys</div>
            </div>
            <div class="window-body">
                <p style="font-size: 12px; margin-top: 0;">📅 <b>拖动年份查看发展历程：</b> <span id="yearDisplay" style="color: #ff4081; font-weight: bold;">2024</span></p>
                
                <!-- 年份拖动条 -->
                <input type="range" id="yearSlider" min="2024" max="2026" step="1" value="2024" style="width: 100%; margin: 10px 0;" oninput="updateTimeline(this.value)">
                
                <!-- 动态内容显示框 -->
                <div id="timelineContent" style="background: #fff; padding: 12px; border: 1px inset #ccc; font-size: 12px; line-height: 1.6;">
                    <!-- 由 JS 动态填充 -->
                </div>
            </div>
        </div>

    </div>

    <script>
        // 时间轴数据库
        const timelineData = {
            "2024": { album: "SUPER REAL ME (出道迷你专辑)", song: "Magnetic", event: "正式出道，凭借标志性风格打破多项流媒体新人记录。" },
            "2025": { album: "I'LL LIKE YOU (第二张迷你专辑)", song: "Cherish (My Love)", event: "发布全新概念作品，开启多城市粉丝见面会与全球音乐节演出。" },
            "2026": { album: "Digital Single / Special Project", song: "New Release Vibe", event: "推出全新数字单曲，上线多维互动与实时可视化数据监视系统。" }
        };

        function updateTimeline(year) {
            document.getElementById('yearDisplay').innerText = year;
            const data = timelineData[year];
            document.getElementById('timelineContent').innerHTML = `
                <p style="margin: 4px 0;"><b>💿 核心专辑：</b>${data.album}</p>
                <p style="margin: 4px 0;"><b>🎵 代表曲目：</b>${data.song}</p>
                <p style="margin: 4px 0; color: #555;"><b>✨ 重要事件：</b>${data.event}</p>
            `;
        }
        // 初始化默认显示 2024
        updateTimeline("2024");
    </script>
</body>
</html>
